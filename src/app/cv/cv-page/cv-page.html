<div #divElement class="row">
  @if (cvsResources.isLoading()) {
    <div class="alert alert-info">
      Loading...
    </div>
  } @else {
    <div class="col"><app-cv-list [cvs]="cvsResources.value()"/></div>
  }
  <div class="col"><app-cv-card [cv]="selectedCv()"/></div>
</div>
<div>
  @defer (on hover(); prefetch on interaction(divElement) ) {
    <app-embauche />
  } @placeholder {
    <div>Placeholder...</div>
  } @loading {
    Loading...
  }

</div>
